              - entity: sensor.shelly3em63g3_e4b063f69434_leistung
                name: 1A
                icon: mdi:home-outline
                display_zero: true
              - entity: sensor.leistung1b
                name: 1B
                icon: mdi:home-outline
                display_zero: true
      - type: entities
        title: Mini laden
        show_header_toggle: false
        entities:
          - entity: input_boolean.daily_charging_enabled
            name: Tägliches Laden
          - entity: input_boolean.adhoc_charging_enabled
            name: Adhoc Laden
          - entity: input_boolean.daily_force_charge_suspended
            name: Zwangsladung aussetzen
          - entity: input_number.pv_estimated_auto_soc_correction
            name: SOC-Schätzer Vorgabe
          - entity: input_button.pv_apply_estimated_auto_soc_correction
            name: SOC-Schätzer Vorgabe übernehmen
          - entity: sensor.pv_estimated_auto_soc
            name: SOC-Wert (live geschätzt)
          - entity: select.go_echarger_325099_phase_switch_mode
            name: Lade-Modus
          - entity: number.go_echarger_325099_set_max_ampere_limit
            name: Ladestrom
          - entity: sensor.go_echarger_325099_car_state
            name: Wallbox Status
          - entity: sensor.pv_charge_status
            name: Lade Status
          - type: button
            name: PV Aceman Dashboard
            icon: mdi:ev-station
            tap_action:
              action: navigate
              navigation_path: /pv-charging-dashboard/pv-laden
  - title: Abrechnung
    path: abrechnung
    icon: mdi:cash
    cards:
      - type: entities
        title: Abrechnungszeitraum
        show_header_toggle: false
        entities:
          - entity: input_datetime.energy_billing_start
            name: Beginn
          - entity: input_datetime.energy_billing_end
            name: Ende
          - entity: input_number.energy_billing_heat_price
            name: WärmeStrom (EUR/kWh)
          - entity: input_number.energy_billing_house_price
            name: Hausstrom (EUR/kWh)
          - entity: input_number.energy_billing_feed_in_price
            name: Einspeisung (EUR/kWh)
          - entity: input_button.energy_billing_calculate
            name: Berechnung durchführen
      - type: entities
        title: Energie-Differenzen
        show_header_toggle: false
        entities:
          - entity: sensor.influx_billing_battery_discharged_energy
            name: Batteriespeicher entladen
          - entity: sensor.influx_billing_wallbox_energy
            name: Wallbox geladen
          - entity: sensor.influx_billing_heat_pump_energy
            name: Waermepumpe
          - entity: sensor.influx_billing_house_1a_energy
            name: Haus 1A
          - entity: sensor.influx_billing_house_1b_energy
            name: Haus 1B
          - entity: sensor.influx_billing_grid_import_energy
            name: Netzbezug
          - entity: sensor.influx_billing_grid_export_energy
            name: Einspeisung
      - type: entities
        title: Kosten und Erloese
        show_header_toggle: false
        entities:
          - entity: sensor.abrechnung_waermestrom_kosten
            name: WärmeStrom Kosten
          - entity: sensor.abrechnung_netzbezug_kosten
            name: Hausstrom Netzbezug Kosten
          - entity: sensor.abrechnung_einspeisung_erloes
            name: Einspeisung Erloes
          - entity: sensor.abrechnung_netzsaldo
            name: Netzsaldo