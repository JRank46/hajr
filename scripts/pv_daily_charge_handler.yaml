pv_daily_charge_handler:
  alias: PV Tageslade-Handler
  mode: single
  sequence:
    - variables:
        next_day: >-
          {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
          {% set today = now().weekday() %}
          {{ 1 if now() >= today_at(states('input_datetime.daily_charge_time_' + days[today])) else 0 }}
        weekday: "{{ (now().weekday() + (next_day | int)) % 7 }}"
        weekday_name: >
          {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
          {{ days[weekday] }}
        target_soc: >
          {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
          {{ states('input_number.daily_target_soc_' + days[weekday]) | float(0) }}
        departure: "{{ today_at(states('input_datetime.daily_charge_time_' + weekday_name)) + timedelta(days=next_day | int) }}"
        pv_power: "{{ states('sensor.solarnet_pv_leistung') | float(0) }}"
        pv_forecast_power: "{{ states('sensor.solcast_pv_forecast_leistung_in_1_stunde') | float(0) }}"
        home_consumption: "{{ states('sensor.solarnet_leistung_verbrauch') | float(0) }}"
        charging_power: "{{ states('sensor.go_echarger_325099_power_total') | float(0) }}"
        auto_soc: "{{ states('sensor.pv_estimated_auto_soc') | float(0) }}"
        auto_soc_raw: "{{ states('sensor.aceman_e_battery_hv_state_of_charge') | float(0) }}"
        battery_capacity_kwh: "{{ states('input_number.auto_battery_capacity') | float(38.5) }}"
        force_state: "{{ states('select.go_echarger_325099_force_state') }}"
        car_state: "{{ states('sensor.go_echarger_325099_car_state') }}"
        force_charge_suspended: "{{ is_state('input_boolean.daily_force_charge_suspended', 'on') }}"
        force_charge_notification_sent: "{{ is_state('input_boolean.daily_force_charge_notification_sent', 'on') }}"
        force_charge_start_at: "{{ states('input_datetime.daily_force_charge_start_at') }}"
        force_charge_complete_notification_2100_sent: "{{ is_state('input_boolean.daily_force_charge_complete_notification_2100_sent', 'on') }}"
        force_charge_complete_notification_2130_sent: "{{ is_state('input_boolean.daily_force_charge_complete_notification_2130_sent', 'on') }}"
        configured_surplus_current_rounding: "{{ states('input_select.pv_surplus_current_rounding') }}"
        home_storage_soc: "{{ states('sensor.hvm_ladezustand') | float(0) }}"
        home_storage_round_down_threshold: "{{ states('input_number.home_storage_soc_round_down_threshold') | float(60) }}"
        home_storage_rounding_forced: "{{ home_storage_soc >= home_storage_round_down_threshold }}"
        surplus_current_rounding: "{{ 'Abrunden' if home_storage_rounding_forced else configured_surplus_current_rounding }}"
        current_mode: "{{ states('select.go_echarger_325099_phase_switch_mode') }}"
        current_limit: "{{ states('number.go_echarger_325099_set_max_ampere_limit') | int }}"
        phase_switch_to_1_pending: "{{ is_state('input_boolean.phase_switch_to_1_pending', 'on') }}"
        phase_switch_to_1_requested_at: "{{ states('input_datetime.phase_switch_to_1_requested_at') }}"
        mode_stable: "{{ (now() - states.select.go_echarger_325099_phase_switch_mode.last_changed).total_seconds() >= 300 }}"
        limit_stable: "{{ (now() - states.number.go_echarger_325099_set_max_ampere_limit.last_changed).total_seconds() >= 300 }}"
        available_charge_power: "{{ states('sensor.pv_charge_available_power') | float(0) }}"
        pv_start_ready: "{{ is_state('binary_sensor.pv_charge_start_ready', 'on') }}"
        pv_stop_required: "{{ is_state('binary_sensor.pv_charge_stop_required', 'on') }}"
        current_hour_pv_forecast_wh: "{{ states('sensor.solcast_pv_forecast_prognose_aktuelle_stunde') | float(0) }}"
        forecast_surplus_power: >
          {% set surplus = pv_forecast_power - home_consumption + charging_power %}
          {{ [surplus, 0] | max | round(0) }}
        time_hours: >
          {% if departure is none %}
            0
          {% else %}
            {{ ((as_timestamp(departure) - as_timestamp(now())) / 3600) | float(0) }}
          {% endif %}
        energy_needed_wh: >
          {% set diff = target_soc - auto_soc %}
          {% if diff <= 0 %}0
          {% else %}{{ diff / 100 * battery_capacity_kwh * 1000 }}
          {% endif %}
        min_required_power: >
          {% if time_hours > 0 %}
            {{ ((energy_needed_wh / time_hours) | float(0)) | round(0, 'ceil') }}
          {% else %}
            0
          {% endif %}
        target_reached: "{{ auto_soc >= target_soc }}"
        force_charge_notification_required: "{{ current_hour_pv_forecast_wh < 500 and not target_reached and not force_charge_suspended and not force_charge_notification_sent }}"
        force_charge_due: >-
          {{ force_charge_notification_sent and not target_reached and not force_charge_suspended and
             force_charge_start_at not in ['unknown', 'unavailable', 'none'] and
             as_timestamp(now()) >= as_timestamp(force_charge_start_at) }}
        force_charge_required: "{{ force_charge_due and car_state != 'Complete' }}"
        target_power: >
          {% if force_charge_required %}
            {{ [available_charge_power, min_required_power] | max }}
          {% else %}
            {{ available_charge_power }}
          {% endif %}
        desired_mode: >-
          {{ 'Force_3' if target_power >= 4000 else 'Force_1' }}
        phase_switch_to_1_requested: "{{ current_mode == 'Force_3' and desired_mode == 'Force_1' }}"
        phase_switch_to_1_due: >-
          {{ phase_switch_to_1_pending and
             phase_switch_to_1_requested_at not in ['unknown', 'unavailable', 'none'] and
             (as_timestamp(now()) - as_timestamp(phase_switch_to_1_requested_at)) >= 1800 }}
        base_limit: >
          {% if target_power >= 4000 %}
            {% set current = (target_power / 690) | round(0, 'ceil' if surplus_current_rounding == 'Aufrunden' else 'floor') %}
          {% else %}
            {% set current = (target_power / 230) | round(0, 'ceil' if surplus_current_rounding == 'Aufrunden' else 'floor') %}
          {% endif %}
          {{ [6, [current, 16] | min] | max }}
        desired_limit: >
          {% if target_reached or car_state == 'Complete' or (pv_stop_required and not force_charge_required) %}
            0
          {% elif force_state != 'Neutral' %}
            {{ base_limit }}
          {% elif not limit_stable %}
            {{ current_limit }}
          {% elif base_limit > current_limit %}
            {{ [current_limit + 2, base_limit, 16] | min }}
          {% elif base_limit < current_limit %}
            {{ [current_limit - 2, base_limit, 6] | max }}
          {% else %}
            {{ current_limit }}
          {% endif %}
        charge_permitted: >
          {{ not target_reached and
             (force_charge_required or
              (force_state == 'Neutral' and not pv_stop_required) or
              (force_state != 'Neutral' and pv_start_ready)) }}
        desired_force_state: "{{ 'Off' if target_reached else 'Neutral' }}"
        needs_update: "{{ current_mode != desired_mode or current_limit != desired_limit or force_state != desired_force_state }}"
        can_update: "{{ force_state != 'Neutral' or desired_limit == 0 or (mode_stable and limit_stable) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ phase_switch_to_1_requested and not phase_switch_to_1_pending }}"
          sequence:
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.phase_switch_to_1_pending
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.phase_switch_to_1_requested_at
              data:
                datetime: "{{ now().strftime('%Y-%m-%d %H:%M:%S') }}"
        - conditions:
            - condition: template
              value_template: "{{ not phase_switch_to_1_requested and phase_switch_to_1_pending }}"
          sequence:
            - service: input_boolean.turn_off
              target:
                entity_id: input_boolean.phase_switch_to_1_pending
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ force_charge_notification_required }}"
          sequence:
            - service: persistent_notification.create
              data:
                title: 'PV Tagesladung'
                message: >
                  Mini Aceman E konnte nicht bis zum gewünschten {{ target_soc | round(0) }} % SOC
                  mit der PV-Prognose der aktuellen Stunde von {{ (current_hour_pv_forecast_wh / 1000) | round(1) }} kWh geladen werden.
                  Es wird eine Zwangsladung von {{ (energy_needed_wh / 1000) | round(1) }} kWh
                  ab {{ (now() + timedelta(hours=1)).strftime('%d.%m.%Y %H:%M') }} durchgeführt.
                notification_id: pv_force_charge_notification
            - service: notify.mobile_app_pizzaiolo_sepp
              data:
                title: 'PV Tagesladung'
                message: >
                  Mini Aceman E konnte nicht bis zum gewünschten {{ target_soc | round(0) }} % SOC
                  mit der PV-Prognose der aktuellen Stunde von {{ (current_hour_pv_forecast_wh / 1000) | round(1) }} kWh geladen werden.
                  Es wird eine Zwangsladung von {{ (energy_needed_wh / 1000) | round(1) }} kWh
                  ab {{ (now() + timedelta(hours=1)).strftime('%d.%m.%Y %H:%M') }} durchgeführt.
                data:
                  push:
                    interruption-level: time-sensitive
                    sound: default
            - service: notify.mobile_app_apfel
              data:
                title: 'PV Tagesladung'
                message: >
                  Mini Aceman E konnte nicht bis zum gewünschten {{ target_soc | round(0) }} % SOC
                  mit der PV-Prognose der aktuellen Stunde von {{ (current_hour_pv_forecast_wh / 1000) | round(1) }} kWh geladen werden.
                  Es wird eine Zwangsladung von {{ (energy_needed_wh / 1000) | round(1) }} kWh
                  ab {{ (now() + timedelta(hours=1)).strftime('%d.%m.%Y %H:%M') }} durchgeführt.
                data:
                  push:
                    interruption-level: time-sensitive
                    sound: default
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.daily_force_charge_notification_sent
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.daily_force_charge_cycle_until
              data:
                datetime: "{{ departure.strftime('%Y-%m-%d %H:%M:%S') }}"
            - service: input_datetime.set_datetime
              target:
                entity_id: input_datetime.daily_force_charge_start_at
              data:
                datetime: "{{ (now() + timedelta(hours=1)).strftime('%Y-%m-%d %H:%M:%S') }}"
        - conditions:
            - condition: template
              value_template: "{{ force_charge_due and car_state == 'Complete' and now().strftime('%H:%M:%S') == '21:00:00' and not force_charge_complete_notification_2100_sent }}"
          sequence:
            - service: notify.mobile_app_pizzaiolo_sepp
              data:
                title: 'PV Tagesladung'
                message: 'Zwangsladung kann nicht durchgeführt werden, da der Wallbox-Status auf Complete steht.'
            - service: notify.mobile_app_apfel
              data:
                title: 'PV Tagesladung'
                message: 'Zwangsladung kann nicht durchgeführt werden, da der Wallbox-Status auf Complete steht.'
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.daily_force_charge_complete_notification_2100_sent
        - conditions:
            - condition: template
              value_template: "{{ force_charge_due and car_state == 'Complete' and now().strftime('%H:%M:%S') == '21:30:00' and not force_charge_complete_notification_2130_sent }}"
          sequence:
            - service: notify.mobile_app_pizzaiolo_sepp
              data:
                title: 'PV Tagesladung'
                message: 'Zwangsladung kann nicht durchgeführt werden, da der Wallbox-Status auf Complete steht.'
            - service: notify.mobile_app_apfel
              data:
                title: 'PV Tagesladung'
                message: 'Zwangsladung kann nicht durchgeführt werden, da der Wallbox-Status auf Complete steht.'
            - service: input_boolean.turn_on
              target:
                entity_id: input_boolean.daily_force_charge_complete_notification_2130_sent
        - conditions:
            - condition: template
              value_template: "{{ needs_update }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ current_mode != desired_mode and can_update and (not phase_switch_to_1_requested or phase_switch_to_1_due) }}"
                  sequence:
                    - service: select.select_option
                      target:
                        entity_id: select.go_echarger_325099_phase_switch_mode
                      data:
                        option: "{{ desired_mode }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ current_limit != desired_limit and can_update }}"
                  sequence:
                    - service: number.set_value
                      target:
                        entity_id: number.go_echarger_325099_set_max_ampere_limit
                      data:
                        value: "{{ desired_limit }}"
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ force_state != desired_force_state }}"
                  sequence:
                    - service: select.select_option
                      target:
                        entity_id: select.go_echarger_325099_force_state
                      data:
                        option: "{{ desired_force_state }}"
