pv_adhoc_charge_handler:
  alias: PV Adhoc Lade-Handler
  mode: single
  sequence:
    - variables:
        target_soc: "{{ states('input_number.adhoc_target_soc') | float(0) }}"
        pv_power: "{{ states('sensor.solarnet_pv_leistung') | float(0) }}"
        home_consumption: "{{ states('sensor.solarnet_leistung_verbrauch') | float(0) }}"
        charging_power: "{{ states('sensor.go_echarger_325099_power_total') | float(0) }}"
        auto_soc: "{{ states('sensor.pv_estimated_auto_soc') | float(0) }}"
        auto_soc_raw: "{{ states('sensor.aceman_e_battery_hv_state_of_charge') | float(0) }}"
        battery_capacity_kwh: "{{ states('input_number.auto_battery_capacity') | float(38.5) }}"
        force_state: "{{ states('select.go_echarger_325099_force_state') }}"
        car_state: "{{ states('sensor.go_echarger_325099_car_state') }}"
        restart_latched: "{{ is_state('input_boolean.wallbox_restart_latched', 'on') }}"
        adhoc_mode: "{{ states('input_select.adhoc_charge_mode') }}"
        adhoc_max_limit: "{{ states('input_number.adhoc_charge_current_limit') | int }}"
        surplus_current_rounding: "{{ states('input_select.pv_surplus_current_rounding') }}"
        current_mode: "{{ states('select.go_echarger_325099_phase_switch_mode') }}"
        current_limit: "{{ states('number.go_echarger_325099_set_max_ampere_limit') | int }}"
        mode_stable: "{{ (now() - states.select.go_echarger_325099_phase_switch_mode.last_changed).total_seconds() >= 300 }}"
        limit_stable: "{{ (now() - states.number.go_echarger_325099_set_max_ampere_limit.last_changed).total_seconds() >= 300 }}"
        pv_surplus_power: >
          {% set surplus = pv_power - home_consumption + charging_power %}
          {{ [surplus, 0] | max | round(0) }}
        energy_needed_wh: >
          {% set diff = target_soc - auto_soc %}
          {% if diff <= 0 %}0
          {% else %}{{ diff / 100 * battery_capacity_kwh * 1000 }}
          {% endif %}
        target_power: >
          {% if target_soc <= auto_soc %}
            0
          {% elif adhoc_mode == 'Nur PV-Überschuss' %}
            {{ pv_surplus_power }}
          {% elif adhoc_mode == 'Maximale Ladeleistung' %}
            {{ (adhoc_max_limit * 230 * 3) | int }}
          {% else %}
            0
          {% endif %}
        desired_mode: >-
          {{ 'Force_3' if (adhoc_mode == 'Maximale Ladeleistung' and target_power > 0) or target_power >= 4000 else 'Force_1' }}
        starting_session: "{{ force_state != 'Neutral' }}"
        base_limit: >
          {% if target_power >= 4000 %}
            {% set current = (target_power / 690) | round(0, 'ceil' if surplus_current_rounding == 'Aufrunden' else 'floor') %}
          {% else %}
            {% set current = (target_power / 230) | round(0, 'ceil' if surplus_current_rounding == 'Aufrunden' else 'floor') %}
          {% endif %}
          {{ [6, [current, adhoc_max_limit] | min] | max }}
        desired_limit: >
          {% if adhoc_mode == 'Maximale Ladeleistung' and target_power > 0 %}
            {{ adhoc_max_limit }}
          {% elif starting_session %}
            {{ base_limit }}
          {% elif not limit_stable %}
            {{ current_limit }}
          {% elif base_limit > current_limit %}
            {{ [current_limit + 2, base_limit, adhoc_max_limit] | min }}
          {% elif base_limit < current_limit %}
            {{ [current_limit - 2, base_limit, 6] | max }}
          {% else %}
            {{ current_limit }}
          {% endif %}
        desired_force_state: "{{ 'Neutral' if target_power > 0 else 'Off' }}"
        needs_update: "{{ current_mode != desired_mode or current_limit != desired_limit or force_state != desired_force_state }}"
        can_update: "{{ starting_session or (mode_stable and limit_stable) }}"
        charger_should_charge: "{{ target_power > 0 and (adhoc_mode in ['Nur PV-Überschuss', 'Maximale Ladeleistung', 'Auto']) }}"
    - choose:
        - conditions:
            - condition: template
              value_template: "{{ target_power > 0 and charger_should_charge }}"
          sequence:
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ car_state != 'Complete' and restart_latched }}"
                  sequence:
                    - service: input_boolean.turn_off
                      target:
                        entity_id: input_boolean.wallbox_restart_latched
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ car_state == 'Complete' and force_state == 'Neutral' and not restart_latched }}"
                  sequence:
                    - service: select.select_option
                      target:
                        entity_id: select.go_echarger_325099_force_state
                      data:
                        option: 'Off'
                    - delay:
                        seconds: 2
                    - service: select.select_option
                      target:
                        entity_id: select.go_echarger_325099_force_state
                      data:
                        option: 'Neutral'
                    - service: input_boolean.turn_on
                      target:
                        entity_id: input_boolean.wallbox_restart_latched
            - choose:
                - conditions:
                    - condition: template
                      value_template: "{{ needs_update and can_update }}"
                  sequence:
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ current_mode != desired_mode }}"
                          sequence:
                            - service: select.select_option
                              target:
                                entity_id: select.go_echarger_325099_phase_switch_mode
                              data:
                                option: "{{ desired_mode }}"
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ current_limit != desired_limit }}"
                          sequence:
                            - service: number.set_value
                              target:
                                entity_id: number.go_echarger_325099_set_max_ampere_limit
                              data:
                                value: "{{ desired_limit }}"
                    - choose:
                        - conditions:
                            - condition: template
                              value_template: "{{ force_state != 'Neutral' }}"
                          sequence:
                            - service: select.select_option
                              target:
                                entity_id: select.go_echarger_325099_force_state
                              data:
                                option: 'Neutral'
                    - service: persistent_notification.create
                      data:
                        title: 'PV Adhocladung'
                        message: >
                          Lade-Einstellung aktualisiert auf {{ desired_mode }} / {{ desired_limit }} A und Force-State = Neutral.
                - conditions:
                    - condition: template
                      value_template: "{{ needs_update and not can_update }}"
                  sequence:
                    - service: persistent_notification.create
                      data:
                        title: 'PV Adhocladung'
                        message: >
                          Phase/Strom warten 5 Minuten Stabilität, bevor ein erneuter Wechsel erfolgt.
      default:
        - choose:
            - conditions:
                - condition: template
                  value_template: >-
                    {{ states('select.go_echarger_325099_force_state') != 'Off' }}
              sequence:
                - service: select.select_option
                  target:
                    entity_id: select.go_echarger_325099_force_state
                  data:
                    option: 'Off'
        - service: persistent_notification.create
          data:
            title: 'PV Adhocladung'
            message: 'Kein Ladebedarf oder Abfahrt vorbei.'
