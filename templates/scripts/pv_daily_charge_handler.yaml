pv_daily_charge_handler:
  alias: PV Tageslade-Handler
  sequence:
    - choose:
        - conditions:
            - condition: numeric_state
              entity_id: {{ pv_power_sensor }}
              above: {{ input_number_pv_surplus_threshold }}
            - condition: numeric_state
              entity_id: {{ auto_soc_sensor }}
              below: {{ input_number_target_soc }}
          sequence:
            - service: switch.turn_on
              target:
                entity_id: {{ ev_charger_switch }}
            - service: persistent_notification.create
              data:
                title: 'PV Tagesladung'
                message: 'Ladegerät eingeschaltet wegen PV-Überschuss.'
        - conditions:
            - condition: numeric_state
              entity_id: {{ auto_soc_sensor }}
              above: {{ input_number_target_soc }}
          sequence:
            - service: switch.turn_off
              target:
                entity_id: {{ ev_charger_switch }}
            - service: persistent_notification.create
              data:
                title: 'PV Tagesladung'
                message: 'Ziel-SOC erreicht, Ladegerät ausgeschaltet.'
      default:
        - service: switch.turn_off
          target:
            entity_id: {{ ev_charger_switch }}
