- sensor:
    - name: "pv_estimated_auto_soc"
      unique_id: pv_estimated_auto_soc
      unit_of_measurement: '%'
      icon: mdi:battery-charging-high
      state: >
        {% set baseline_soc = states('input_number.charge_session_start_soc') | float(0) %}
        {% set baseline_energy = states('input_number.charge_session_start_energy') | float(0) %}
        {% set energy_now = states('sensor.go_echarger_325099_energy_charged') | float(0) %}
        {% set capacity_wh = (states('input_number.auto_battery_capacity') | float(38.5)) * 1000 %}
        {% set raw_soc = states('sensor.aceman_e_battery_hv_state_of_charge') | float(0) %}
        {% set delta_wh = [energy_now - baseline_energy, 0] | max %}
        {% set estimate = (baseline_soc + (delta_wh / capacity_wh * 100)) if capacity_wh > 0 else raw_soc %}
        {{ [100, [raw_soc, estimate] | max] | min | round(1) }}
    - name: "pv_surplus_soc_estimate"
      unique_id: pv_surplus_soc_estimate
      unit_of_measurement: '%'
      state: >
        {% set current = states('sensor.pv_estimated_auto_soc') | float(0) %}
        {% set pv = states('sensor.solarnet_pv_leistung') | float(0) %}
        {% set home = states('sensor.rank_josef_haus_1a_und_1b_leistung_ac') | float(0) %}
        {% set charging = states('sensor.go_echarger_325099_power_total') | float(0) %}
        {% set capacity = states('input_number.auto_battery_capacity') | float(38.5) %}
        {% set departure = today_at(states('input_datetime.adhoc_departure_time')) %}
        {% set time = ((as_timestamp(departure) - as_timestamp(now())) / 3600) if departure is not none else 0 %}
        {% set surplus = [pv - home - charging, 0] | max %}
        {{ (current if (time <= 0 or capacity <= 0) else ([100, (current + (surplus * time / capacity * 100))] | min)) | round(1) }}
    - name: "pv_max_charge_soc_estimate"
      unique_id: pv_max_charge_soc_estimate
      unit_of_measurement: '%'
      state: >
        {% set current = states('sensor.pv_estimated_auto_soc') | float(0) %}
        {% set capacity = states('input_number.auto_battery_capacity') | float(38.5) %}
        {% set departure = today_at(states('input_datetime.adhoc_departure_time')) %}
        {% set time = ((as_timestamp(departure) - as_timestamp(now())) / 3600) if departure is not none else 0 %}
        {% set current_limit = 16 %}
        {{ (current if (time <= 0 or capacity <= 0) else ([100, (current + (current_limit * 230 * 3 * time / capacity * 100))] | min)) | round(1) }}
    - name: "pv_charge_surplus_power"
      unique_id: pv_charge_surplus_power
      unit_of_measurement: 'W'
      state: >
        {% set pv = states('sensor.solarnet_pv_leistung') | float(0) %}
        {% set home = states('sensor.rank_josef_haus_1a_und_1b_leistung_ac') | float(0) %}
        {% set charging = states('sensor.go_echarger_325099_power_total') | float(0) %}
        {{ [pv - home - charging, 0] | max | round(0) }}
    - name: "pv_charge_target_power"
      unique_id: pv_charge_target_power
      unit_of_measurement: 'W'
      state: >
        {% set target_soc = states('input_number.adhoc_target_soc') | float(0) %}
        {% set current = states('sensor.pv_estimated_auto_soc') | float(0) %}
        {% set departure = today_at(states('input_datetime.adhoc_departure_time')) %}
        {% set time = ((as_timestamp(departure) - as_timestamp(now())) / 3600) if departure is not none else 0 %}
        {% set capacity = states('input_number.auto_battery_capacity') | float(38.5) %}
        {% set pv = states('sensor.solarnet_pv_leistung') | float(0) %}
        {% set home = states('sensor.rank_josef_haus_1a_und_1b_leistung_ac') | float(0) %}
        {% set charging = states('sensor.go_echarger_325099_power_total') | float(0) %}
        {% set surplus = [pv - home - charging, 0] | max %}
        {% set needed_wh = ([target_soc - current, 0] | max) / 100 * capacity * 1000 %}
        {% set adhoc_mode = states('input_select.adhoc_charge_mode') %}
        {% set adhoc_limit = states('input_number.adhoc_charge_current_limit') | int %}
        {{ ((adhoc_limit * 230 * 3) if (adhoc_mode == 'Maximale Ladeleistung' and target_soc > current) else (([surplus, ((needed_wh / time) | round(0, 'ceil'))] | max) if (time > 0 and needed_wh > 0) else 0)) | round(0) }}
    - name: "pv_charge_status"
      unique_id: pv_charge_status
      state: >
        {% set surplus = states('sensor.pv_charge_surplus_power') | float(0) %}
        {% set target = states('sensor.pv_charge_target_power') | float(0) %}
        {{ 'Bereit' if target <= 0 else ('PV Überschuss' if surplus >= target else 'Zwangsladung') }}

# Debug-Sensoren: spiegeln 1:1 die "variables:"-Berechnung der Handler-Skripte,
# damit alle Zwischenwerte auf dem Dashboard sichtbar sind, ohne auf ein
# Skript-Log warten zu müssen. Bei Änderungen an den Handlern hier nachziehen.
- trigger:
    - platform: time_pattern
      seconds: "/5"
  variables:
    target_soc: "{{ states('input_number.adhoc_target_soc') | float(0) }}"
    departure: "{{ today_at(states('input_datetime.adhoc_departure_time')) }}"
    pv_power: "{{ states('sensor.solarnet_pv_leistung') | float(0) }}"
    home_consumption: "{{ states('sensor.rank_josef_haus_1a_und_1b_leistung_ac') | float(0) }}"
    charging_power: "{{ states('sensor.go_echarger_325099_power_total') | float(0) }}"
    auto_soc: "{{ states('sensor.pv_estimated_auto_soc') | float(0) }}"
    auto_soc_raw: "{{ states('sensor.aceman_e_battery_hv_state_of_charge') | float(0) }}"
    battery_capacity_kwh: "{{ states('input_number.auto_battery_capacity') | float(38.5) }}"
    force_state: "{{ states('select.go_echarger_325099_force_state') }}"
    adhoc_charging_enabled: "{{ states('input_boolean.adhoc_charging_enabled') }}"
    adhoc_mode: "{{ states('input_select.adhoc_charge_mode') }}"
    adhoc_max_limit: "{{ states('input_number.adhoc_charge_current_limit') | int }}"
    current_mode: "{{ states('select.go_echarger_325099_phase_switch_mode') }}"
    current_limit: "{{ states('number.go_echarger_325099_set_max_ampere_limit') | int }}"
    mode_stable: "{{ (now() - states.select.go_echarger_325099_phase_switch_mode.last_changed).total_seconds() >= 300 }}"
    limit_stable: "{{ (now() - states.number.go_echarger_325099_set_max_ampere_limit.last_changed).total_seconds() >= 300 }}"
    pv_surplus_power: >
      {% set surplus = pv_power - home_consumption - charging_power %}
      {{ [surplus, 0] | max | round(0) }}
    time_hours: >
      {% if departure is none %}
        0
      {% else %}
        {{ ((as_timestamp(departure) - as_timestamp(now())) / 3600) | float(0) }}
      {% endif %}
    energy_needed_wh: >
      {% set diff = target_soc - auto_soc %}
      {% if diff <= 0 %}0
      {% else %}{{ diff / 100 * battery_capacity_kwh * 1000 }}
      {% endif %}
    min_required_power: >
      {% if time_hours > 0 %}
        {{ ((energy_needed_wh / time_hours) | float(0)) | round(0, 'ceil') }}
      {% else %}
        0
      {% endif %}
    target_power: >
      {% if target_soc <= auto_soc or departure is none or time_hours <= 0 %}
        0
      {% elif adhoc_mode == 'Nur PV-Überschuss' %}
        {{ pv_surplus_power }}
      {% elif adhoc_mode == 'Maximale Ladeleistung' %}
        {{ (adhoc_max_limit * 230 * 3) | int }}
      {% else %}
        {{ [pv_surplus_power, min_required_power] | max }}
      {% endif %}
    desired_mode: >-
      {{ 'Force_3' if (adhoc_mode == 'Maximale Ladeleistung' and target_power > 0) or target_power >= 4000 else 'Force_1' }}
    desired_limit: >
      {% if adhoc_mode == 'Maximale Ladeleistung' and target_power > 0 %}
        16
      {% elif target_power >= 4000 %}
        {% set current = (target_power / 690) | round(0, 'ceil') %}
        {{ [6, [current, 16] | min] | max }}
      {% else %}
        {% set current = (target_power / 230) | round(0, 'ceil') %}
        {{ [6, [current, 16] | min] | max }}
      {% endif %}
    needs_update: "{{ current_mode != desired_mode or current_limit != desired_limit }}"
    starting_session: "{{ force_state != 'Neutral' }}"
    can_update: "{{ not needs_update or starting_session or (mode_stable and limit_stable) }}"
  sensor:
    - name: "pv_adhoc_debug"
      unique_id: pv_adhoc_debug
      icon: mdi:bug-check-outline
      state: "{{ 'Ladebedarf' if target_power > 0 else 'Kein Ladebedarf' }}"
      attributes:
        adhoc_charging_enabled: "{{ adhoc_charging_enabled }}"
        adhoc_mode: "{{ adhoc_mode }}"
        adhoc_max_limit_a: "{{ adhoc_max_limit }}"
        target_soc_pct: "{{ target_soc }}"
        auto_soc_raw_pct: "{{ auto_soc_raw }}"
        auto_soc_fast_estimate_pct: "{{ auto_soc }}"
        departure_time: "{{ departure }}"
        time_until_departure_h: "{{ time_hours | round(2) }}"
        pv_power_w: "{{ pv_power }}"
        home_consumption_w: "{{ home_consumption }}"
        wallbox_charging_power_w: "{{ charging_power }}"
        pv_surplus_power_w: "{{ pv_surplus_power }}"
        energy_needed_wh: "{{ energy_needed_wh | round(0) }}"
        min_required_power_w: "{{ min_required_power }}"
        target_power_w: "{{ target_power }}"
        desired_mode: "{{ desired_mode }}"
        desired_limit_a: "{{ desired_limit }}"
        current_mode: "{{ current_mode }}"
        current_limit_a: "{{ current_limit }}"
        force_state: "{{ force_state }}"
        mode_stable_5min: "{{ mode_stable }}"
        limit_stable_5min: "{{ limit_stable }}"
        needs_update: "{{ needs_update }}"
        can_update: "{{ can_update }}"

- trigger:
    - platform: time_pattern
      seconds: "/5"
  variables:
    weekday: "{{ now().weekday() }}"
    weekday_name: >
      {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
      {{ days[weekday] }}
    target_soc: >
      {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
      {{ states('input_number.daily_target_soc_' + days[weekday]) | float(0) }}
    departure: "{{ today_at(states('input_datetime.daily_charge_time_' + weekday_name)) }}"
    pv_power: "{{ states('sensor.solarnet_pv_leistung') | float(0) }}"
