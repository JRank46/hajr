- id: pv_force_charge_notification
  alias: 'PV Zwangsladung ankündigen'
  description: 'Kündigt eine Zwangsladung einmalig an und plant sie eine Stunde später ein.'
  trigger:
    - platform: time_pattern
      minutes: '/1'
  variables:
    next_day: >-
      {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
      {% set today = now().weekday() %}
      {{ 1 if now() >= today_at(states('input_datetime.daily_charge_time_' + days[today])) else 0 }}
    weekday: "{{ (now().weekday() + (next_day | int)) % 7 }}"
    weekday_name: >-
      {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
      {{ days[weekday] }}
    departure: "{{ today_at(states('input_datetime.daily_charge_time_' + weekday_name)) + timedelta(days=next_day | int) }}"
    target_soc: >-
      {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
      {{ states('input_number.daily_target_soc_' + days[weekday]) | float(0) }}
    auto_soc: "{{ states('sensor.pv_estimated_auto_soc') | float(0) }}"
    battery_capacity_kwh: "{{ states('input_number.auto_battery_capacity') | float(38.5) }}"
    car_state: "{{ states('sensor.go_echarger_325099_car_state') }}"
    current_hour_pv_forecast_wh: "{{ states('sensor.solcast_pv_forecast_prognose_aktuelle_stunde') | float(0) }}"
    energy_needed_wh: >-
      {% set difference = target_soc - auto_soc %}
      {{ difference / 100 * battery_capacity_kwh * 1000 if difference > 0 else 0 }}
  condition:
    - condition: state
      entity_id: input_boolean.daily_charging_enabled
      state: 'on'
    - condition: state
      entity_id: input_boolean.daily_force_charge_suspended
      state: 'off'
    - condition: state
      entity_id: input_boolean.daily_force_charge_notification_sent
      state: 'off'
    - condition: template
      value_template: "{{ auto_soc < target_soc and current_hour_pv_forecast_wh < 500 and car_state != 'Idle' }}"
  action:
    - service: input_boolean.turn_on
      target:
        entity_id: input_boolean.daily_force_charge_notification_sent
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.daily_force_charge_cycle_until
      data:
        datetime: "{{ as_datetime(departure).strftime('%Y-%m-%d %H:%M:%S') }}"
    - service: input_datetime.set_datetime
      target:
        entity_id: input_datetime.daily_force_charge_start_at
      data:
        datetime: "{{ (now() + timedelta(hours=1)).strftime('%Y-%m-%d %H:%M:%S') }}"
    - service: persistent_notification.create
      data:
        title: 'PV Tagesladung'
        message: >
          Mini Aceman E konnte nicht bis zum gewünschten {{ target_soc | round(0) }} % SOC
          mit der PV-Prognose der aktuellen Stunde von {{ (current_hour_pv_forecast_wh / 1000) | round(1) }} kWh geladen werden.
          Es wird eine Zwangsladung von {{ (energy_needed_wh / 1000) | round(1) }} kWh
          ab {{ (now() + timedelta(hours=1)).strftime('%d.%m.%Y %H:%M') }} durchgeführt.
        notification_id: pv_force_charge_notification
    - service: notify.mobile_app_pizzaiolo_sepp
      data:
        title: 'PV Tagesladung'
        message: >
          Mini Aceman E konnte nicht bis zum gewünschten {{ target_soc | round(0) }} % SOC laden.
          Zwangsladung ab {{ (now() + timedelta(hours=1)).strftime('%d.%m.%Y %H:%M') }}.
    - service: notify.mobile_app_apfel
      data:
        title: 'PV Tagesladung'
        message: >
          Mini Aceman E konnte nicht bis zum gewünschten {{ target_soc | round(0) }} % SOC laden.
          Zwangsladung ab {{ (now() + timedelta(hours=1)).strftime('%d.%m.%Y %H:%M') }}.
  mode: single

- id: pv_daily_charge_idle_notification
  alias: 'PV Tagesladung: Fahrzeug nicht angeschlossen'
  description: 'Warnt um 22 Uhr einmalig, wenn das Fahrzeug nicht angeschlossen ist und der Ziel-SOC fehlt.'
  trigger:
    - platform: time
      at: '22:00:00'
  variables:
    next_day: >-
      {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
      {% set today = now().weekday() %}
      {{ 1 if now() >= today_at(states('input_datetime.daily_charge_time_' + days[today])) else 0 }}
    weekday: "{{ (now().weekday() + (next_day | int)) % 7 }}"
    target_soc: >-
      {% set days = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'] %}
      {{ states('input_number.daily_target_soc_' + days[weekday]) | float(0) }}
    auto_soc: "{{ states('sensor.pv_estimated_auto_soc') | float(0) }}"
  condition:
    - condition: state
      entity_id: input_boolean.daily_charging_enabled
      state: 'on'
    - condition: state
      entity_id: sensor.go_echarger_325099_car_state
      state: 'Idle'
    - condition: template
      value_template: "{{ auto_soc < target_soc }}"
  action:
    - service: persistent_notification.create
      data:
        title: 'PV Tagesladung'
        message: >
          Ziel-SOC von {{ target_soc | round(0) }} % wurde nicht erreicht, da das Fahrzeug
          nicht an der Wallbox angeschlossen ist (Status Idle).
        notification_id: pv_daily_charge_idle_notification
    - service: notify.mobile_app_pizzaiolo_sepp
      data:
        title: 'PV Tagesladung'
        message: 'Ziel-SOC wurde nicht erreicht, da das Fahrzeug nicht an der Wallbox angeschlossen ist (Status Idle).'
    - service: notify.mobile_app_apfel
      data:
        title: 'PV Tagesladung'
        message: 'Ziel-SOC wurde nicht erreicht, da das Fahrzeug nicht an der Wallbox angeschlossen ist (Status Idle).'
  mode: single