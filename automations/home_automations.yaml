- id: '1764655411325'
  alias: Raffstore schliessen
  description: ''
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.shelly2pmg4_1020bafb0734_input_1
      from: 'off'
      to: 'on'
      for:
        hours: 0
        minutes: 0
        seconds: 2
  conditions:
    - condition: state
      entity_id: binary_sensor.shelly2pmg4_1020bafb0734_overheating
      state: 'off'
  actions:
    - repeat:
        until:
          - condition: or
            conditions:
              - condition: state
                state: 'on'
                entity_id: binary_sensor.shelly2pmg4_1020bafb0734_input_0
              - condition: state
                entity_id: cover.shelly2pmg4_1020bafb0734
                state: closed
        sequence:
          - action: cover.close_cover
            metadata: {}
            data: {}
            target:
              entity_id: cover.shelly2pmg4_1020bafb0734
            enabled: true
  mode: single

- id: '1764657175351'
  alias: Raffstore oeffnen
  description: ''
  triggers:
    - trigger: state
      entity_id:
        - binary_sensor.shelly2pmg4_1020bafb0734_input_0
      to: 'on'
      for:
        hours: 0
        minutes: 0
        seconds: 2
  conditions: []
  actions:
    - action: cover.open_cover
      target:
        entity_id:
          - cover.shelly2pmg4_1020bafb0734
      data: {}
    - repeat:
        until:
          - condition: or
            conditions:
              - condition: state
                entity_id: binary_sensor.shelly2pmg4_1020bafb0734_input_1
                state: 'on'
              - condition: state
                entity_id: cover.shelly2pmg4_1020bafb0734
                state: open
        sequence:
          - action: cover.open_cover
            metadata: {}
            data: {}
            target:
              entity_id: cover.shelly2pmg4_1020bafb0734
  mode: single
